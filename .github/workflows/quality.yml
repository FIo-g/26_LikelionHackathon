name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      visual_mode:
        description: Capture reviewed baselines explicitly, or strictly compare committed baselines.
        required: false
        default: compare
        type: choice
        options: [capture, compare]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://planner:planner@127.0.0.1:5432/planner_test
      BETTER_AUTH_SECRET: test-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      AUTH_RATE_LIMIT_ENABLED: "true"
      OPENAI_API_KEY: test-key
      OPENAI_MODEL: gpt-5.6-luna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec -- auth generate --yes --config src/shared/auth/auth.ts --output prisma/schema.auth-check.prisma
      - run: npm run verify:auth-schema
      - run: npm run test:run
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  visual-and-accessibility:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: visual-tests
    env:
      ADAPTIVE_SLEEP_E2E_DATABASE_URL: ${{ vars.ADAPTIVE_SLEEP_E2E_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - name: Capture candidate baselines for review
        if: inputs.visual_mode == 'capture'
        run: npm run test:visual -- --update-snapshots
      - name: Compare reviewed baselines strictly
        if: inputs.visual_mode == 'compare'
        run: npm run test:visual
      - run: npm exec -- playwright test tests/e2e/accessibility.spec.ts --project=chromium
      - if: always()
        run: rm -f prisma/schema.auth-check.prisma prisma/schema.active.prisma
